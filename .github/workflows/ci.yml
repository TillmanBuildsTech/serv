name: CI

on:
  push:
    branches: [main, dev, release]
  pull_request:
    branches: [main, dev, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if VERSION already has a release tag
        run: |
          version=$(tr -d '[:space:]' < internal/version/VERSION)
          echo "current VERSION: $version"
          if git ls-remote --tags origin | grep -q "refs/tags/v${version}$"; then
            echo "::error::Version v${version} already exists on origin. Bump internal/version/VERSION (and CHANGELOG.md) before merging to main."
            exit 1
          fi
          echo "v${version} is a new version - OK"

  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        go-version: ['1.23', '1.24', '1.25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -v -race ./...

      - name: Integration tests
        run: go test -tags=integration ./test/integration/...

      - name: Build binary
        run: make build
